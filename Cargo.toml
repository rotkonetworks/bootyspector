[package]
name = "bootyspector"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
futures = "0.3"
prometheus = "0.13"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
warp = "0.3"

# litep2p dependencies
litep2p = { version = "0.14", features = ["websocket", "quic"] }
rustls = { version = "0.23", default-features = true, features = ["ring"] }

# smoldot light client
smoldot-light = "1.1"
smoldot = "1.1"
futures-util = "0.3"

# database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
chrono = "0.4"
sha2 = "0.10"

